name = "jofi-music"

[phases.setup]
nixPkgs = ["python312", "nodejs_22"]

[phases.install]
cmds = [
  "python -m venv /opt/venv",
  "/opt/venv/bin/pip install --upgrade pip",
  "/opt/venv/bin/pip install -r requirements.txt",
  "cd app && npm install && npm run build"
]

[start]
cmd = "/opt/venv/bin/python server.py"
